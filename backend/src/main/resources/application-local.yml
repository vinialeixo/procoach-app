spring:
  datasource:
    url: jdbc:h2:mem:procoachdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

# Chave JWT apenas para desenvolvimento local — nunca usar fora do profile local.
procoach:
  security:
    jwt:
      secret: procoach-dev-jwt-secret-01234567