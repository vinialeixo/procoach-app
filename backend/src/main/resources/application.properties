spring.application.name=procoach

# Swagger / OpenAPI 3 — contrato oficial do front-end
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Segurança (T-008): chave HMAC para assinar/validar JWTs. O valor default é
# apenas para desenvolvimento local — em produção, sobrescrever via variável de
# ambiente PROCOACH_JWT_SECRET (mínimo de 32 bytes para HS256).
procoach.security.jwt.secret=${PROCOACH_JWT_SECRET:procoach-dev-jwt-secret-01234567}
procoach.security.jwt.access-token-ttl=PT15M
procoach.security.jwt.refresh-token-ttl=P7D
procoach.security.jwt.mfa-challenge-ttl=PT5M
