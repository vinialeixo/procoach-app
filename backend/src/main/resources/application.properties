spring.application.name=procoach

# Swagger / OpenAPI 3 — contrato oficial do front-end
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Segurança (T-008): chave HMAC para assinar/validar JWTs. Sem valor default de
# propósito: defina a variável de ambiente PROCOACH_JWT_SECRET (mínimo de 32
# bytes para HS256). Para desenvolvimento local, o profile `local` traz uma
# chave só de dev (application-local.yml); os testes usam config/application.properties.
procoach.security.jwt.secret=${PROCOACH_JWT_SECRET}
# MFA/TOTP desligado por enquanto (backlog T-059: reintroduzir endurecido).
procoach.security.mfa.enabled=${PROCOACH_MFA_ENABLED:false}
# Avisos ao atleta fora do app (T-071). E-mail por SMTP: defina spring.mail.host/port/username/password (via
# ambiente) e procoach.notification.email.enabled=true. Push: sem provedor por padrão; "log" só registra no log
# (a integração com FCM/APNs entra como uma implementação de PushGateway).
procoach.notification.async=true
procoach.notification.retry.enabled=true
procoach.notification.retry.interval-ms=300000
procoach.notification.email.enabled=${PROCOACH_EMAIL_ENABLED:false}
procoach.notification.email.from=${PROCOACH_EMAIL_FROM:no-reply@procoach.local}
procoach.notification.push.provider=${PROCOACH_PUSH_PROVIDER:none}
procoach.security.jwt.access-token-ttl=PT15M
procoach.security.jwt.refresh-token-ttl=P7D
procoach.security.jwt.mfa-challenge-ttl=PT5M
