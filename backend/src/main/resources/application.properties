spring.application.name=procoach

# Swagger / OpenAPI 3 — contrato oficial do front-end
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Segurança (T-008): chave HMAC para assinar/validar JWTs. Sem valor default de
# propósito: defina a variável de ambiente PROCOACH_JWT_SECRET (mínimo de 32
# bytes para HS256). Para desenvolvimento local, o profile `local` traz uma
# chave só de dev (application-local.yml); os testes usam config/application.properties.
procoach.security.jwt.secret=${PROCOACH_JWT_SECRET}
procoach.security.jwt.access-token-ttl=PT15M
procoach.security.jwt.refresh-token-ttl=P7D
procoach.security.jwt.mfa-challenge-ttl=PT5M
