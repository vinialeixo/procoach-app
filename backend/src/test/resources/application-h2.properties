# Profile h2: testes de integração sem Docker (./mvnw test -Dspring.profiles.active=h2).
# H2 em memória no modo PostgreSQL; o schema vem das entidades JPA (as migrações Flyway
# são específicas do Postgres e só são validadas na execução com Testcontainers).
spring.datasource.url=jdbc:h2:mem:procoach-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
