# Mesclado com o application.properties principal durante os testes (maior precedência).
# Chave JWT descartável, só para testes.
procoach.security.jwt.secret=procoach-test-jwt-secret-0123456789
# Os testes de integração cobrem o fluxo de MFA, que segue implementado atrás da flag.
procoach.security.mfa.enabled=true
# Entrega externa dos avisos: síncrona e sem repetição agendada, para o teste ser determinístico.
procoach.notification.async=false
procoach.notification.retry.enabled=false
