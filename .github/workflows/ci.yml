name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Rápido: perfil h2, sem Docker. Pega regressão de regra de negócio, segurança e API.
  backend-h2:
    name: Backend (H2, rápido)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - name: Testes (perfil h2)
        run: ./mvnw -B -ntp verify -Dspring.profiles.active=h2
      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-h2
          path: backend/target/surefire-reports
          retention-days: 7

  # Fiel à produção: Postgres real via Testcontainers, com as migrations Flyway V100+ de verdade.
  # É o único job que valida o SQL das migrations (o H2 usa ddl-auto e não roda Flyway).
  backend-postgres:
    name: Backend (Postgres + Flyway)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - name: Testes (Postgres real)
        run: ./mvnw -B -ntp verify
      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-postgres
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
